id = "poplar"
name = "Poplar"
description = "Syntax highlighting and the language server for the Poplar datapack language."
version = "0.5.0"
schema_version = 1
authors = ["Poplar"]

# The grammar is in this repo. `rev` must be a pushed commit that has the generated `tree-sitter-poplar/src/parser.c`.
[grammars.poplar]
repository = "https://github.com/poplar-mc/poplar-gram-extension"
path = "tree-sitter-poplar"
rev = "4b6e8dff61758a496e318d9b1c81107a911474c7"

# Gram runs `poplar lsp`, which src/lib.rs finds on the PATH.
[language_servers.poplar]
name = "Poplar"
languages = ["Poplar"]
