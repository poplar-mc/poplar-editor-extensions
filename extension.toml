id = "poplar"
name = "Poplar"
description = "Syntax highlighting and the language server for the Poplar datapack language."
version = "0.1.0"
schema_version = 1
authors = ["Poplar"]

# The grammar lives in the poplar monorepo. `rev` must be a commit there that has the generated `src/parser.c`.
[grammars.poplar]
repository = "https://github.com/poplar-mc/poplar"
path = "editors/tree-sitter-poplar"
rev = "770c74e9d8e59131e9ad23ada8dc7b98338b1bc5"

# Gram runs `poplar lsp`, which src/lib.rs finds on the PATH.
[language_servers.poplar]
name = "Poplar"
languages = ["Poplar"]
